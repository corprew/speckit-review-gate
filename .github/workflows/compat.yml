name: Compat (latest specify)

# Early-warning check against the LATEST spec-kit release (unpinned), so upstream
# changes that break installation surface here instead of in a contributor's PR.
# Does not run on push/PR — those use the pinned specify in ci.yml.
on:
  schedule:
    - cron: '0 12 * * 1'   # Mondays 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compat
  cancel-in-progress: true

jobs:
  latest-specify:
    name: Multi-agent install (latest specify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install latest specify CLI (unpinned)
        run: |
          uv tool install specify-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report specify version
        run: specify --version || specify version || true

      - name: Install across agents and assert command + hook
        run: bash scripts/test/multi-agent-install.sh
