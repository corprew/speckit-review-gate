name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: ShellCheck bash scripts
        run: shellcheck scripts/bash/*.sh scripts/test/*.sh

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts/powershell -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "ok - $($_.Name)"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate extension manifest
        run: |
          python -m pip install --quiet pyyaml
          python scripts/test/validate-manifest.py

  test-scripts:
    name: Test diff scripts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main

      - name: Run collect-diff test harness
        run: bash scripts/test/test-collect-diff.sh

  install-matrix:
    name: Multi-agent install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install specify CLI
        # Pinned for reproducibility; bump as the extension is verified against
        # newer spec-kit releases.
        run: |
          uv tool install "specify-cli==0.13.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install across agents and assert command + hook
        run: bash scripts/test/multi-agent-install.sh
