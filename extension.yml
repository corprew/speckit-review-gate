schema_version: "1.0"

extension:
  id: "review-gate"
  name: "Spec Kit Review Gate"
  version: "1.1.0"
  description: "Reviews the implementation diff after /speckit.implement and gates on high-severity findings. Uses /code-review by default, with a portable embedded reviewer for other agents."
  author: "Corprew"
  repository: "https://github.com/corprew/speckit-review-gate"
  license: "MIT"
  homepage: "https://github.com/corprew/speckit-review-gate"

requires:
  # after_implement hook wiring landed in PR #1702; pin a minimum once that
  # release is tagged. Until then >=0.1.0 plus the manual command as a fallback.
  speckit_version: ">=0.1.0"
  tools:
    - name: "git"
      required: true

provides:
  commands:
    - name: "speckit.review-gate.review"
      file: "commands/speckit.review-gate.review.md"
      description: "Review the feature-branch implementation diff and gate on high-severity findings."

  config:
    - name: "review-gate-config.yml"
      template: "config-template.yml"
      description: "Review effort, base-branch detection, severity threshold, and override policy."
      required: false

hooks:
  # Optional: after /speckit.implement the agent prompts the user to run the gate.
  # The same command is always available to run manually.
  after_implement:
    command: "speckit.review-gate.review"
    optional: true
    prompt: "Implementation complete. Run the review gate on the diff now?"
    description: "Reviews the feature-branch diff and blocks on high-severity findings."
    condition: null

tags:
  - "review"
  - "quality"
  - "gate"
  - "claude"

defaults:
  effort: "high"
  base_branch: "auto"
  # Review backend: a delegate command (e.g. "/code-review" on Claude Code) or
  # "embedded" to have the agent review the diff itself. Delegates fall back to
  # the embedded reviewer on agents that don't provide the command.
  review_backend: "/code-review"
  gate:
    min_severity: "high"
    categories: ["security", "bug"]
    min_confidence: "high"
    advisory_only_below_bar: true
  report_path: "review-gate-report.md"
  allow_override: true
